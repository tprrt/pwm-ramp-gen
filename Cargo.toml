[package]
name = "pwm-ramp-gen"
version = "0.1.0"
edition = "2018"
resolver = "2"
autobins = false

[lib]
name = "pwm_ramp_gen"
crate-type = ["staticlib"]
path = "src/main.rs"

[profile.release]
panic = "abort"

[dependencies]
riot-wrappers = { version = "0.9.2", features = ["set_panic_handler"], default-features = false }
riot-sys = "0.7.16"

[patch.crates-io]
# c2rust >= 0.22 emits type paths with a leading "::", which the released
# derive turns into an empty identifier and panics on
c2rust-bitfields-derive = { path = "vendor/c2rust-bitfields-derive" }
